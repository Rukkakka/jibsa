name: 🐛 버그 제보
description: 명령이 문서와 다르게 동작하거나, 매물·가격이 잘못 나올 때
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        제보 감사합니다. 붙여 넣는 내용에서 토큰·쿠키, 중개사 연락처 같은
        개인정보는 지워 주세요.

  - type: dropdown
    id: area
    attributes:
      label: 영역
      description: 어느 부분에서 문제가 생겼나요?
      options:
        - 직방 (jibsa zigbang)
        - 네이버 부동산 (jibsa naver)
        - 당근부동산 (jibsa daangn)
        - 다방 (jibsa dabang)
        - 요청 제한 (jibsa limits, RATE_LIMITED)
        - CLI 출력·에러 형식
        - 기타 / 잘 모르겠음
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요?
      description: 기대한 결과와 실제 결과를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      description: 문제를 일으키는 가장 짧은 명령.
      placeholder: "jibsa zigbang search listings room 역삼동 --trade 월세 --deposit-max 1000"
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: 출력 또는 에러
      description: stdout 결과나 stderr 의 에러 JSON. `--verbose` 로그가 있으면 함께 붙여 주세요.
      render: shell
    validations:
      required: false

  - type: input
    id: versions
    attributes:
      label: 환경
      description: "`jibsa --version` 출력, Python 버전, 실행한 날짜. 비공식 API 라 날짜가 중요합니다."
      placeholder: "jibsa 0.1.0 (커밋 a1b2c3d), Python 3.11.6, 2026-10-06"
    validations:
      required: false
