name: ✨ 기능
description: 새 소스, 명령, 옵션, 엔드포인트 제안
labels: ["feature"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: 무엇이 있어야 하나요?
      description: |
        원하는 소스, 명령, 옵션, 엔드포인트를 설명해 주세요. 새 엔드포인트라면
        확인한 요청·응답 예시를 함께 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 왜 필요한가요?
      description: 지금 명령으로는 할 수 없는 일이 무엇인가요?
    validations:
      required: true

  - type: textarea
    id: usage
    attributes:
      label: 사용 예
      description: 생기면 쓰고 싶은 명령과 기대하는 출력을 적어 주세요.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: conventions
    attributes:
      label: 규약
      options:
        - label: 새 엔드포인트·소스라면 docs/development/provider-conventions.md 를 읽었다
          required: false
        - label: 출력이 바뀐다면 docs/development/output-contract.md 를 읽었다
          required: false
        - label: 로그인 없이 호출되는 기능이다 (README 원칙 '로그인 없는 기능만')
          required: false
        - label: 결과가 그 사이트 웹에서도 같은 조건으로 볼 수 있는 것이다 (README 원칙 '사이트가 보여 주는 대로')
          required: false
